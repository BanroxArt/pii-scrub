[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piiscrub"
version = "0.1.0"
description = "Redact and pseudonymise personal data and credentials in logs and structured records: emails, phones, payment cards (Luhn), SSNs, IBANs (mod 97), JWTs, bearer tokens and secret-named fields."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Art Akopian" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]

[project.urls]
Source = "https://github.com/BanroxArt/pii-scrub"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
piiscrub = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[project.scripts]
piiscrub = "piiscrub.cli:main"
